[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Moteur de chiffrement et coffre-fort de fichiers (crypto core), sans dépendance UI."

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
